        accent: generic American, young and cheerful
        description: Betty Hale, on her honeymoon, room 305
    lindqvist:
        sex: male
        accent: Pacific Northwest, slow and plain
        description: Nils Lindqvist, owns fishing boats in Ballard, room 401
    crane:
        sex: female
        accent: generic American, precise
        description: Miss Dorothy Crane, schoolteacher from Yakima, room 404
    hollis:
        sex: male
        accent: generic American, older, dry
        description: Dr. Walter Hollis, visiting surgeon, room 101
    desk_clerk:
        sex: male
        accent: generic American, young and polite
        description: hotel front desk clerk
    waiter:
        sex: male
        accent: generic American, older and patient
        description: hotel room service order taker
    florist:
        sex: female
        accent: generic American, friendly
        description: clerk at the Harbor Florist
    pizza_man:
        sex: male
        accent: Italian American
        description: counterman at Sunny Hill Pizza
    dispatcher:
        sex: female
        accent: generic American, brisk
        description: dispatcher at Shilshole Cab
    maitre_d:
        sex: male
        accent: smooth, formal American
        description: maitre d' at Canlis
    reporter:
        sex: male
        accent: generic American, fast and nosy
        description: Joe Barrett, reporter for the Seattle Times
    martha:
        sex: female
        accent: A dog who can speak, with a deep dog-like voice
        description: Martha the dog
    marysmith:
        sex: female
        accent: >
            A 1930s American woman in her early thirties. Husky, slightly
            raspy alto with a hint of nasal brightness. Speaks quickly and
            crisply, with a dry, wisecracking, working-girl edge. Her voice
            is a little unstable: on emotional or surprised words it cracks
            upward into a brief, high squeak, then drops back to the husky
            register. Tough on the surface, vulnerable underneath. Clear
            mid-Atlantic-leaning diction, not breathy or sultry.
        description: Mary Smith in the film Easy Living
        sample: Look, mister, I work for a living. I ride the bus and I eat at the automat, and nobody ever gave me anything before.
    carsalesman:
        sex: male
        accent: American, but attempts to sound sophisticated with a pseudo British accent
        description: Salesman for the V16 Company of America

    # Guests added 2026-09-28.
    pemberton:
        sex: female
        accent: affected upper-class American, drawling and imperious
        description: Mrs. Vivian Pemberton, wealthy widow from Pasadena, room 102; nothing is ever quite right
    dobbs:
        sex: male
        accent: Nebraska, loud and cheerful
        description: Earl Dobbs, feed-store owner from Omaha on his first vacation, room 105
    vance:
        sex: female
        accent: sultry, low, a little sleepy
        description: Miss Lorraine Vance, nightclub singer appearing downtown, room 201; sleeps till noon
    beaumont:
        sex: male
        accent: Southern, booming, old-fashioned
        description: Colonel Augustus Beaumont, retired, of Savannah, Georgia, room 205
    finch:
        sex: male
