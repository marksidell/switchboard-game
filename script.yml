tutor:
    # The introduction, in three parts (game_control.md 4.9, Rev 31). After
    # each but the last the game waits for More Help or Next Call on the
    # Stream Deck; after the last, for Next Call.
    intro-jacks: >
        You are the operator at the Hotel Ballard. On the face of your
        switchboard are the jacks for the telephones in the hotel. Each jack
        has a lamp, which glows when someone picks up a telephone and wants to
        make a call. The bottom row of jacks are the trunks. Calls from
        outside come in on them, and you place calls to the city on them.
        Press: More Help. Or press: Next Call, to start playing.
    intro-cords: >
        Below the jacks are ten pairs of cords. You use a pair of cords to
        connect a caller to the party they want.
        Press: More Help. Or press: Next Call, to start playing.
    intro-switches: >
        In front of the cords are two rows of black switches. The switches in
        front of each pair put your headset on the call, and ring the
        telephones. The dial on the right is for placing outside calls on a
        trunk.
        When you are ready for your first call, press: Next Call.

    # Answering. From a room the game cannot tell when the cord goes in, so
    # both steps are one line; from a trunk it can, and they are two.
    answer-station: >
        Someone in the hotel is calling. Take the rear cord of any free pair,
        and plug it into the jack with the lighted lamp. Always answer the
        hotel with a rear cord, so the front cord is free if the caller wants
        an outside line. Then, to talk to the caller: you always talk with
        the black switch nearest you. Find it, in front of that pair, and
        push it away from you.
    answer-trunk: >
        A call is coming in from outside. Outside lines always take a front
        cord. Take the front cord of any free pair, and plug it into the
        trunk jack with the lighted lamp.
    talk: >
        To talk to the caller: you always talk with the black switch nearest
        you. Find it, in front of that pair, and push it away from you.

    # Wherever the game waits for her to speak: the operator line the scene
    # gives, or, where it gives none, one of the two after it.
    say: "Say: {line}"
    greet: Greet the caller.
    respond: Now it is your turn to speak.
    # A call to the operator herself, once the caller has asked (Rev 59):
    # said before her first reply, so she knows the call needs no cord.
    for-you: >
        This call is for you, not for another line. Answer the caller
        yourself.
    # After a prompt's last repeat, when the player still has not done it
    # (Rev 60): the board waits on her, and Repeat Help is the way back.
    stuck: >
        If you are not sure what to do, press Repeat Help, and I will tell
        you again.

    # Putting a call through to a room.
    ring-front: >
        Now take the front cord of the same pair, and plug it into the jack
        for {jack}. The near switch rings the front cord. To ring the
        telephone, pull that same black switch toward you for a moment, and
        let it go.
    ring-rear: >
        Now take the rear cord of the same pair, and plug it into the jack for
        {jack}. The far switch rings the rear cord. To ring the telephone,
        pull the black switch farthest from you toward you for a moment, and
        let it go.
    # A call in from a trunk: she rang with the far switch, so the near one
    # still has her on the line.
    center-ringing: >
        When the room answers, return the near switch to its center position,
        so that the two of them can talk.

    # The wrong cord rung, said in every pacing (game_control.md 6.7, Rev 88).
    # A call in from a trunk, its front cord in the trunk:
    rang-trunk: >
        You rang the outside line. Ring the rear cord instead: pull the far
        switch toward you.
    # A call out, its front cord in the trunk:
    rang-outside: >
        Outside lines are dialled, not rung. Wait for dial tone, and dial.
    # A call between stations, its rear cord in the caller's jack:
    rang-caller: >
        You rang the person who called you. Ring the front cord instead: pull
        the near switch toward you.

    # Placing a call to the city.
    trunk-front: >
        Now take the front cord of the same pair: front cords always go to
        the trunks. Plug it into any free trunk jack, in the bottom row.
    dial: >
        Keep the black switch pushed away from you. When you hear dial tone,
        dial {number}. That's {number-digits}.
    dial-operator: >
        Keep the black switch pushed away from you. When you hear dial tone,
        dial zero, for the operator.
    # Said during ringback, before the far end answers, when the call needs
    # nothing more from her; where it does, center: comes after her last word.
    center-dialled: >
        You will hear it ringing. When your party answers, return the switch
        to its center position.
    center: Now return the switch to its center position, and let them talk.
    busy-heard: That is a busy signal. Tell the caller.

    # The end of a call. The game waits for every cord out and every switch
    # centered before it deals another.
    hangup-pair: >
        The lamps in front of the cord pair tell you the call has ended. Pull
        both cords out, and check that the black switches are centered.
    hangup-one: >
        The lamp in front of the cord tells you the caller has hung up. Pull
        the cord out, and check that the black switches are centered.
    ready-manual: Press Next Call when you are ready for another.

    # The same steps said shortly, once she has said each in full twice
    # (game_control.md 4.9, Rev 55). More Help says the full line above. A
    # line not given here is said in full every time; the introduction and
    # the prompts before the operator speaks have no short form.
    brief:
        answer-station: >
            A room is calling. Rear cord into the lighted jack, then push the
            near switch away from you.
        answer-trunk: An outside call. Front cord into the lighted trunk jack.
        talk: Push the near switch away from you, to talk.
        ring-front: >
            Front cord to {jack}. Pull the near switch toward you, to ring.
        ring-rear: >
            Rear cord to {jack}. Pull the far switch toward you, to ring.
        center-ringing: When the room answers, center the near switch.
        trunk-front: Front cord into any free trunk.
        dial: At dial tone, dial {number}.
        dial-operator: At dial tone, dial zero.
        center-dialled: When your party answers, center the switch.
        hangup-pair: The call is over. Pull both cords, and center the switches.
        hangup-one: The caller has hung up. Pull the cord, and center the switches.
        ready-manual: Next Call, when you are ready.
        for-you: This call is for you.

    # The first calls of a game in tutor mode, one of each kind in this
    # order (game_control.md 4.9, Rev 30): each game picks one scene from
    # each group at random, so a restart does not repeat the last. Then the
    # deck deals as usual. Every scene in a group is the same kind of call,
    # active, and not an after: scene.
    lessons:
        # Between rooms.
        -   [desk-hollis, martha-squirrel, lindqvist-valet, nbn-valet,
             hollis-valet, housekeeping-martha, frontdesk-vance]
        # From a room to an outside number.
        -   [lindqvist-rays, dobbs-paramount, dobbs-rays, martha-pizza, dobbs-ferries]
        # From outside to a room.
        -   [times-pike, times-hollis, ld-pike, ld-hollis]
        # To the operator.
        -   [crane-wakeup, martha-mailman, martha-cat, dobbs-stamp, hollis-wakeup,
             vance-wakeup]

