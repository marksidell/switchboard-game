scenes:
    nbn-valet:
        active: true
        calling:
            line: room403
            person: thornhill
        called:
            line: valet
            person: valet
        request:
            id: 1
            text: Hello. Valet service, please.
            operator: internal-greeting
        conversation:
            -   id: 2
                called: Valet service.
            -   id: 3
                caller: Valet? This is room 403. How quickly can you get a suit sponged and pressed?
            -   id: 4
                called: Do you want fast service?
            -   id: 5
                caller: Yes, fast.
            -   id: 6
                called: Twenty minutes, sir.
            -   id: 7
                caller: Twenty minutes? Fine. OK. 403.

    nbn-kaplan:
        active: true
        calling:
            line: lobby
            person: valerian
        called:
            line: room403
            person: thornhill
        request:
            id: 1
            text: Connect me with room 403.
            operator: internal-greeting
        conversation:
            -   id: 2
                called: Hello?
            -   id: 3
                caller: It is good to find you in, Mr. Kaplan.
            -   id: 4
                called: Who is this?
            -   id: 5
                caller: >
                    We met only last night and still you do not recognize my voice.
                    I should feel offended.
            -   id: 6
                called: Yeah. Now I know who you are and I am not Mr. Kaplan!
            -   id: 7
                caller: >
                    Of course not. You answer is telephone and you live in his hotel room,
                    and yet you are not Mr. Kaplan. Nevertheless, we are pleased to find you in.
            -   id: 8
                called: Hello? Hello?

    nbn-trace:
        active: true
        after: nbn-kaplan
        delay: 2
        calling:
            line: room403
            person: thornhill
        request:
            id: 1
            text: >
                Operator, this is Mr. Thorn-- Mr. Kaplan in 403.
                That call that just came through. Was that an outside call or from the lobby?
            operator: internal-greeting
        closing:
            id: 2
            text: That call was from the lobby, sir.

    # Station to station.
    pike-breakfast:
        active: true
        calling:
            line: room204
            person: pike
        called:
            line: roomservice
            person: waiter
        request:
            id: 1
            text: Room service, please.
            operator: internal-greeting
        conversation:
            -   id: 2
                called: Room service.
            -   id: 3
                caller: Yeah, this is Pike in 204. Two eggs over easy, bacon, toast, and a pot of coffee.
            -   id: 4
                called: Two eggs over easy, bacon, toast, coffee. Anything else, sir?
            -   id: 5
                caller: A newspaper, if you've got one.
            -   id: 6
                called: Right away, sir. About twenty minutes.
            -   id: 7
                caller: Make it fifteen and there's a quarter in it for you.

    # Outgoing. The guest does not know the number, so the operator must look it up.
    albright-florist:
        active: true
        calling:
            line: room302
            person: albright
        called:
            line: florist
            person: florist
        request:
            id: 1
