scenes:
    nbn-valet:
        active: true
        calling:
            line: room403
            person: thornhill
        called:
            line: valet
            person: valet
        request:
            id: 1
            text: Hello. Valet service, please.
        conversation:
            -   id: 2
                called: Valet service.
            -   id: 3
                caller: Valet? This is room 403. How quickly can you get a suit sponged and pressed?
            -   id: 4
                called: Do you want fast service?
            -   id: 5
                caller: Yes, fast.
            -   id: 6
                called: Twenty minutes, sir.
            -   id: 7
                caller: Twenty minutes? Fine. OK. 403.

    nbn-kaplan:
        active: true
        calling:
            line: lobby
            person: assassin
        called:
            line: room403
            person: thornhill
        request:
            id: 1
            text: Connect me with room 403.
        conversation:
            -   id: 2
                called: Hello?
            -   id: 3
                caller: Mr. Kaplan, how good it is to find you in.
            -   id: 4
                called: Who are you?
            -   id: 5
                caller: We will meet very soon.

    nbn-trace:
        active: true
        after: nbn-kaplan
        delay: 2
        calling:
            line: room403
            person: thornhill
        request:
            id: 1
            text: Operator, where did that call come from?

    # Station to station.
    pike-breakfast:
        active: true
        calling:
            line: room204
            person: pike
        called:
            line: roomservice
            person: waiter
        request:
            id: 1
            text: Room service, please.
        conversation:
            -   id: 2
                called: Room service.
            -   id: 3
                caller: Yeah, this is Pike in 204. Two eggs over easy, bacon, toast, and a pot of coffee.
            -   id: 4
                called: Two eggs over easy, bacon, toast, coffee. Anything else, sir?
            -   id: 5
                caller: A newspaper, if you've got one.
            -   id: 6
                called: Right away, sir. About twenty minutes.
            -   id: 7
                caller: Make it fifteen and there's a quarter in it for you.

    # Outgoing. The guest does not know the number, so the operator must look it up.
    albright-florist:
        active: true
        calling:
            line: room302
            person: albright
        called:
            line: florist
            person: florist
        request:
            id: 1
            text: Operator, I'd like the Harbor Florist, please. I'm afraid I don't have the number.
        conversation:
            -   id: 2
                called: Harbor Florist.
            -   id: 3
                caller: This is Mrs. Albright at the Hotel Ballard. I'd like a dozen white roses sent up to room 305.
            -   id: 4
                called: White roses, room 305. What should the card say?
            -   id: 5
                caller: Just say, congratulations, from a well-wisher.
            -   id: 6
                called: Very good, ma'am. They'll be there this afternoon.
            -   id: 7
                caller: Thank you, dear.

    # Outgoing, busy. The operator must go back and tell the caller.
    hale-busy:
        active: true
        calling:
            line: room305
            person: hale
        called:
            line: pizza
            person: pizza_man
            busy: true
        request:
            id: 1
            text: Hello, operator? Could you get me Sunny Hill Pizza, please?
        conversation:
            -   id: 2
                caller: Busy? Oh, bother. All right, I'll call back later.

    # Incoming on a trunk.
    times-pike:
        active: true
        calling:
            line: times
            person: reporter
        called:
            line: room204
            person: pike
        request:
            id: 1
            text: Room 204, please. Mr. Harold Pike.
        conversation:
            -   id: 2
                called: Pike.
            -   id: 3
                caller: Mr. Pike, Joe Barrett, Seattle Times. Is it true you sold a vacuum cleaner to the mayor?
            -   id: 4
                called: Who told you that?
            -   id: 5
                caller: So it's true.
            -   id: 6
                called: No comment. And don't call here again.

    # Call to the operator. Asks for a wake-up call.
    crane-wakeup:
        active: true
        calling:
            line: room404
            person: crane
        request:
            id: 1
            text: Operator? Could you ring me at six-thirty tomorrow morning? I have an early bus.
        conversation:
            -   id: 2
                caller: Thank you. Room 404. Good night.

    # Outgoing.
    lindqvist-canlis:
        active: true
        calling:
            line: room401
            person: lindqvist
        called:
            line: canlis
            person: maitre_d
        request:
            id: 1
            text: Operator, ring Canlis for me, would you?
        conversation:
            -   id: 2
                called: Good evening, Canlis.
            -   id: 3
                caller: This is Nils Lindqvist. I want a table for four tonight. Eight o'clock.
            -   id: 4
                called: Let me see. I can offer you eight-thirty, Mr. Lindqvist, by the window.
            -   id: 5
                caller: Eight-thirty is fine. My wife wants to see the lake.
            -   id: 6
                called: Very good, sir. We look forward to it.
            -   id: 7
                caller: Good. Thank you.

    # Outgoing. The same caller as hale-busy, calling back three minutes later.
    hale-pizza:
        active: true
        after: hale-busy
        delay: 180
        calling:
            line: room305
            person: hale
        called:
            line: pizza
            person: pizza_man
        request:
            id: 1
            text: It's room 305 again. Let's try Sunny Hill Pizza one more time.
        conversation:
            -   id: 2
                called: Sunny Hill Pizza.
            -   id: 3
                caller: Hello! We'd like a large pizza, cheese and mushroom, delivered to the Hotel Ballard. Room 305.
            -   id: 4
                called: Hotel Ballard, 305. That's gonna be forty-five minutes, lady.
            -   id: 5
                caller: Forty-five minutes! We're on our honeymoon. We'll starve.
            -   id: 6
                called: Thirty-five. Best I can do.
            -   id: 7
                caller: All right. Thank you!

    # Station to station, from the staff side.
    desk-hollis:
        active: true
        calling:
            line: frontdesk
            person: desk_clerk
        called:
            line: room101
            person: hollis
        request:
            id: 1
            text: Operator, room 101, please.
        conversation:
            -   id: 2
                called: Hollis.
            -   id: 3
                caller: Dr. Hollis, this is the front desk. A package just came for you from the hospital.
            -   id: 4
                called: Keep it behind the desk. I'll be down in five minutes.
            -   id: 5
                caller: Yes, sir.
            -   id: 6
                called: And don't let anyone sign for it but me.

    # Outgoing long distance: the hotel operator dials 0, asks the local
    # operator for long distance, and the long-distance operator comes on.
    # Inactive until 8 is rendered; 2-7 are unchanged.
    albright-portland:
        active: false
        calling:
            line: room302
            person: albright
        called:
            line: operator
            person: local_operator
        request:
            id: 1
            text: Operator, I'd like to place a long distance call, please.
        conversation:
            -   id: 8
                called: Operator.
            -   id: 2
                called: Long distance.
                person: operator
                wait: true
            -   id: 3
                caller: I'd like to call Portland, Oregon. Person to person, to Mrs. Ruth Seaver. The number is 284-1187.
            -   id: 4
                called: And your name, please?
                person: operator
            -   id: 5
                caller: Mrs. Edith Albright. I'm at the Hotel Ballard in Seattle.
            -   id: 6
                called: One moment, please. I'm sorry, Mrs. Seaver does not answer. Shall I try again later?
                person: operator
            -   id: 7
                caller: Yes, please. In about an hour.

    # From the lobby house phone, outgoing.
    pike-taxi:
        active: true
        calling:
            line: lobby
            person: pike
        called:
            line: taxi
            person: dispatcher
        request:
            id: 1
            text: Operator, get me a taxi, would you?
        conversation:
            -   id: 2
                called: Shilshole Cab.
            -   id: 3
                caller: I need a cab at the front door of the Hotel Ballard. Going to King Street Station.
            -   id: 4
                called: Name?
            -   id: 5
                caller: Pike.
            -   id: 6
                called: Ten minutes, Mr. Pike.
            -   id: 7
                caller: Tell him to step on it. I've got a train to catch.

    martha-roomservice:
        active: false
        calling:
            line: room103
            person: martha
        called:
            line: roomservice
            person: waiter
        request:
            id: 1
            text: Connect me to room service.
        conversation:
            -   id: 2
                called: Room service.
            -   id: 3
                caller: Hello, room service? This is room 103. I'd like to order 8 t-bone steaks, rare, no salad, a half-dozen pork chops, rack of lamb, with a side order of chicken.
            -   id: 4
                called: Will that be all, ma'am?
            -   id: 5
                caller: Just leave it on the floor, please.
            -   id: 6
                called: Our pleasure.
            -   id: 7
                caller: woof, woof, woof!

    easyliving-v16:
        active: false
        calling:
            line: v16company
            person: carsalesman
        called:
            line: imperialsuite
            person: marysmith
        request:
            id: 1
            text: Please connect me with your guest Mary Smith
        conversation:
            -   id: 2
