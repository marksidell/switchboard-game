        description: Mrs. Olsen, the head housekeeper
    bellcaptain:
        sex: male
        accent: generic American, gravelly, seen it all
        description: Gus, the bell captain
        sample: Bell captain. I'll send a boy right up for your bags, sir. Anything else, you just call down and ask for Gus.
    concierge:
        sex: male
        accent: polished, a touch continental
        description: Mr. Fairweather, the hotel concierge; knows everybody
    hostess:
        sex: female
        accent: generic American, bright and professional
        description: hostess at the Stoneburner, the hotel restaurant
    # Martha loose in the hotel (scene panic), 2026-10-14.
    restaurant_waiter:
        sex: male
        accent: faintly continental, a head waiter's dignity
        description: Anton, a waiter in the Stoneburner, the hotel restaurant
    elevator_operator:
        sex: male
        accent: generic American, an older man, easygoing
        description: Floyd, who runs the hotel's elevator

    # Outside, added 2026-09-28.
    pigalle:
        sex: female
        accent: French, charming but firm
        description: reservationist at Place Pigalle
    rays_host:
        sex: male
        accent: Pacific Northwest, easygoing and casual
        description: the fellow who answers the phone at Ray's Boathouse
    telegraph_clerk:
        sex: male
        accent: generic American, clipped
        description: counter clerk at Western Union
        sample: Western Union. Go ahead with your message, sir. That's eighteen words, ninety cents, charged to your room.
    pharmacist:
        sex: male
        accent: generic American, kindly, older
        description: pharmacist at Ballard Pharmacy
    box_office:
        sex: female
        accent: generic American, gum-chewing, bored
        description: box office clerk at the Paramount Theatre
        sample: Paramount box office. Two shows tonight, seven and nine-fifteen. Balcony's seventy-five cents, the main floor is a dollar.
    ferry_clerk:
        sex: male
        accent: Pacific Northwest, salty
        description: information clerk at the Washington State Ferries dock
    nurse:
        sex: female
        accent: generic American, crisp
        description: nurse at the switchboard of Swedish Hospital

    # Far away, reached by long distance, added 2026-09-28.
    gruber:
        sex: male
        accent: Chicago, gruff
        description: Mr. Gruber, Pike's sales manager at the Whirlwind Vacuum Company in Chicago
        sample: Gruber here. Whirlwind Vacuum Company. I've got forty salesmen on the road and every one of them tells me it's raining.
    mrs_dunn:
        sex: female
        accent: Idaho, warm and worried
        description: Mrs. Dunn, Betty Hale's mother, in Boise
        sample: Hello? Betty, is that you, sweetheart? Oh, it's so good to hear your voice. Your father sends his love.
    lucinda:
        sex: female
        accent: Southern, genteel, sharp
        description: Miss Lucinda Beaumont, the Colonel's sister, in Savannah
    edna_finch:
        sex: female
        accent: generic American, practical
        description: Edna Finch, Howard's wife, in Walla Walla
    ruth_seaver:
        sex: female
        accent: Pacific Northwest, older, warm and chatty
        description: Mrs. Ruth Seaver, Mrs. Albright's sister, in Portland
        sample: Edith? Oh, I'm so glad you called back. I was down at the market, and then Mrs. Hanley stopped me on the stairs, and you know how she talks.
    mabel_dobbs:
        sex: female
        accent: Nebraska, plain-spoken and brisk
        description: Mabel Dobbs, Earl's wife, who minds the feed store in Wahoo, Nebraska
        sample: Earl? Is that you? Well, for heaven's sake. The hens are laying fine, the Hendersons paid their bill, and your mother called twice.
    wilbur:
        sex: male
        accent: Nebraska farm boy, slow and friendly
        description: Wilbur, the boy who works the counter at Dobbs Feed and Seed in Wahoo
        sample: Dobbs Feed and Seed, this is Wilbur. We got the laying mash in, and the chicken wire, and I think that's about all we got.
    dr_keller:
        sex: male
        accent: Minnesota, measured
        description: Dr. Keller of the Mayo Clinic in Rochester, Minnesota

    # Visitors on the lobby house phone, added 2026-09-28.
    gunderson:
        sex: female
        accent: Scandinavian Ballard, indignant
        description: Mrs. Gunderson, who bought a vacuum cleaner from Pike
    chester:
        sex: male
        accent: generic American, young, wheedling
        description: Chester, Mrs. Albright's nephew, always short of money
    admirer:
        sex: male
        accent: generic American, young and smitten
        description: a young sailor who heard Lorraine Vance sing last night
    eddie:
        sex: male
        accent: generic American, young man, sheepish
        description: Eddie Moran, a former pupil of Miss Crane, now in the Navy

    # Sergeant Riley, back (2026-10-23): he left with the cut Thornhill
    # scenes on 2026-09-28; now he answers the police in free calls
    # (game_control.md 4.12). His chosen voice is restored, take 2.
    sergeant:
        sex: male
        accent: Irish American, weary
        description: desk sergeant at the Seattle Police
        sample: Police department, Sergeant Riley speaking. All right, slow down, mister. Start from the beginning and tell me what happened.

    # The real Lenny (game_control.md 4.12, Rev 74): his sixteen recordings,
    # released freely on the internet in 2013, answer a number the game does
    # not know. His lines are under freecall:, his takes in tts/recorded/.
    lenny:
        sex: male
        accent: English, elderly, hesitant
        description: Lenny, an old man who keeps telemarketers talking
        recorded: Lenny (the public recordings of 2013)

# What the player says (game_control.md 4.7).
#     The game never plays these: the person at the board speaks them. They
#     are rendered in hotel_operator's voice, as operator.<id>, so that a
#     whole scene can be recorded with both halves of it (tts/scenes --batch).
#     A scene names one of these, or gives its own, with operator: on a line.
#
operator_lines:
    internal-greeting:
        id: 1
        text: How may I connect your call?
    outside-greeting:
        id: 2
        text: Hotel Ballard. How may I help you?
    long-distance-please:
        id: 3
        text: Long distance, please.
    busy:
        id: 4
        text: I'm sorry, that line is busy.
    desk-busy:
        id: 5
        text: I'm sorry, the front desk is busy just now. Please try again in a few minutes.
    housekeeping-busy:
        id: 6
        text: I'm sorry, housekeeping is busy just now. Please try again in a few minutes.
    bellcaptain-busy:
        id: 7
        text: I'm sorry, the bell captain is busy just now. Please try again in a few minutes.
    valet-busy:
        id: 8
        text: I'm sorry, the valet is busy just now. Please try again in a few minutes.

# What the tutor says (game_control.md 4.9). Tutor mode is switched on from
# the Stream Deck; the tutor speaks on the loudspeaker at each step of a call
# and the game waits for her to finish before it goes on.
#
# Each entry is rendered as a line of its own, tutor.<key>. Three are
# templates, rendered once for every value they can take:
#     ring-front, ring-rear  {jack}, for every jack a station is cabled to:
#                            "room 403" for a numbered jack, else its label.
#                            Rendered as tutor.ring-front-<jack>.
#     dial                   {number}, for every outside entry but the
#                            operator, as the operator's card prints it and
#                            said the way an operator says it: SU4-4101 is
#                            "Sunset four, four one oh one" (the exchanges are
#                            hardcopy/seattle-exchanges.csv). tutor.dial-<line>.
#     say                    {line}, for every operator line, under
#                            operator_lines: or a scene's own: tutor.say-<name>,
#                            as tutor.say-operator.1.
# Every other entry is said as written, but lessons:, which is not a line.
#
# What a party says when the operator leaves them hanging (game_control.md 5,
# Rev 60), each rendered in every cast member's voice but the operator's and
# the tutor's, as <kind>.<speaker>. The game plays them; they are in no scene.
reactions:
    # She has not spoken where the game waits for her: said once, 6s in.
    nudge: Hello? Operator? Are you there?
    # They have answered, and nobody is on the line: she rang them on a cord
    # that is not patched to the caller, or rang the wrong room.
    hello: Hello? ... Hello? Is anybody there?
    # She has put the caller through to the wrong party.
    wrong: Operator, that's not who I asked for.

# Free calls, Lenny mode (game_control.md 4.12, Rev 74). A real person on
# station 24 or the public trunk is put through to a room or an outside
# number, and whoever is there answers with their greeting:, then says one
# line at each pause in the caller's talk: the lines: once each in order,
# then the loop: in order, round and round, until the caller hangs up. The
# lines are made to fit after almost anything a caller says. Rendered as
# free.<cast>.g, then free.<cast>.1 up in the order they are said.
#     greeting: what they say on picking up
#     lines:    said once each, after the greeting (may be left out)
#     loop:     said round and round after the lines
#
freecall:
    # Mark's spec, word for word (docs/lenny-spec.txt, 2026-10-23).
    thornhill:
        greeting: Hi! Mellow greetings, ukie-dukie!
        lines:
            - Hey, you remind me of a man!
        loop:
            - The man with the power!
            - The power of hoodoo!
            - You do!
            - Remind me of a man!
    marysmith:
        greeting: Hello? Who is this?
        lines:
            - Oh! Well, I wasn't expecting anybody. Everything's been happening so fast today.
            - Listen, if this is about the coat, I didn't ask for it. It just fell on me. Out of the sky!
        loop:
            - Uh huh. Uh huh. And then what?
            - Gee, you sound just like a fellow I met at the Automat. Are you a banker?
            - Now wait a minute. Who told you I was in the Imperial Suite?
            - Say, that's swell. That's really swell. I think.
            - I'm sorry, the room service man is here again. He keeps bringing me things! Go on.
            - You know, nobody's ever been this nice to me. It makes a girl nervous.
            - Hold on, you're going too fast for me. Start from the part about the money.
            - Well, I'll have to ask Johnny about that. He handles everything now. I think.
    lindqvist:
        greeting: Ahoy! Lindqvist here!
        lines:
            - Ja, you'll have to speak up. I been on the boats all morning and my ears are full of diesel.
        loop:
            - Ja. Ja, sure.
            - Is this about the halibut? Because I told that fella, the halibut's not running till June.
            - Well, now, my father used to say the same thing. He was from Bergen. Very stubborn man.
            - Hold on, I got to find my pencil. Okay. Go ahead.
            - You know, that reminds me of the time the Inga Marie lost her rudder off Cape Flattery.
            - Uh huh. And how much would that run me?
