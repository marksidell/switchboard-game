        description: Swedish Hospital

# Stations within the hotel: the game's station circuits.
# number is the circuit, 1..22.
# Board 3 strips 7 and 8 are the operator tap and the audience monitor output, not stations.
# Which switchboard jack a circuit is cabled to, and its label, are under jacks: below.
#
stations:
    frontdesk:
        number: 1
    lobby:
        number: 2
    restaurant:
        number: 3
    roomservice:
        number: 4
    valet:
        number: 5
    housekeeping:
        number: 6
    bellcaptain:
        number: 7
    concierge:
        number: 8
    imperialsuite:
        number: 9
    room101:
        number: 10
    room102:
        number: 11
    room103:
        number: 12
    room105:
        number: 13
    room201:
