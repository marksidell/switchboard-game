        description: Shilshole Cab
    times:
        number: "622-3000"
        description: The Seattle Times newspaper
    v16company:
        number: "624-1792"
        description: The V16 Company of America
    rays:
        number: "784-5000"
        description: Ray's Boathouse, a popular restaurant for tourists, on a dock near Shilshole Marina
    placepigalle:
        number: "623-7068"
