---
# Switchboard game script.
#
# The general flow is this:
#     - A party signals the switchboard.
#         For a station, the line is seized.
#         For a trunk, a ring signal is generated.
#     - The operator connects to the line, which the game can detect, and speaks.
#     - The caller speaks the "request" to the operator
#     - The operator connects to the desired called party.
#         For a station, the operator connects and rings the station. The called party answers.
#         For a trunk, the operator hears dial tone, dials the number, hears ring, and the called party answers.
#
#  If no called party is specified, the call is to the operator and the callers asks a question.
#  After hearing a response, the caller hangs up.
#
# Lines:
#     A line is either a station name or an outside name.
#     A calling line that is an outside name is a call coming in on a trunk:
#     the game picks a free trunk and rings it.
#     A called line that is an outside name is a call going out: the operator
#     takes a trunk and dials the number.
#
# Calls to the operator (no called party):
#     The conversation holds only caller lines. Each one plays after the
#     operator has spoken and stopped (listen: speech, then silence).
#
# Waiting for the operator mid-conversation (game_control.md 4.6):
#     wait: true on a conversation line means it plays only after the
#     operator has spoken on that side of the call and stopped. Not allowed
#     in a call to the operator or a busy scene, where every line waits.
#
# Someone else on the line (game_control.md 4.6):
#     person: <cast member> on a conversation line means that person says it,
#     on the same side of the call, in place of the scene's party there.
#
# Long distance:
#     The hotel operator dials 0 and gets the local operator, who is
#     called: person: local_operator. The hotel operator asks for long
#     distance; the long-distance operator's first line is marked wait: true
#     and person: operator. She then builds the route as the 1950s operators
#     did, every step on the trunk with a person: of its own: she asks the
#     rate operator (rate_operator) for the route and rate, and rings through
#     each toll center on it (toll_a to toll_d), each answering with its
#     town's name, the last one ringing the number. The party she rings
#     speaks with a person: too. pause: gives each operator on the route a
#     moment to come on the line, and ringback: lets the audience hear the far
#     end ring before the party answers. The long-distance operator may ask
#     the hotel operator whether to charge the room, and her next line is
#     marked wait:. A guest who asked for the time and charges hears them
#     from her when the call ends, unasked.
#     When the circuits are busy she calls back: a following scene rings the
#     hotel on a trunk from outside line operator, and the hotel operator puts
#     the call through to the room. A call coming in from long distance is heard
#     from the last operator on its route only.
#
# A beat before a line (game_control.md 4.6):
#     pause: <seconds> is silence before the line plays; ringback: <seconds>
#     is ringback tone on the trunk before it, only on a called: line of a
#     call to an outside line. Both come after any wait:, pause first.
#
# What the operator says (game_control.md 4.7):
#     operator: on a line is what the player says before it, wherever the
#     game waits for her: the request, a wait: line, and every line of a call
#     to the operator or a busy call. It is the name of a line under
#     operator_lines:, or an id and text of the scene's own:
#         operator: internal-greeting
#         operator:
#             id: 9
#             text: Three cents, sir.
#     closing: on a scene, in either form, is what she says after the last
#     line, in a call to the operator or a busy call, where she is still on
#     the line with the caller when it ends.
#     The game ignores it; it is for recordings of whole scenes. An id given
#     here is one of the scene's, as unique and as permanent as any other.
#
# Busy:
#     busy: true under called means the operator hears busy tone when dialing.
#     The conversation then holds only caller lines, played after the operator
#     goes back to the caller and tells them.
#
# Order:
#     Scenes are drawn at random. A scene with after: is never drawn. It starts
#     delay seconds after the named scene ends, as a new call: the calling line
#     goes off-hook (station) or rings (trunk) again, as for any other scene.
#     Every line in the named scene has hung up by then, so for a caller who
#     calls straight back, delay is also how long they stay on-hook.
#     A scene with after: can itself be followed, so a story can run to any
#     number of calls. Each scene has at most one follower.
#
# Active:
#     Every scene says active: true or active: false. The game plays only
#     active scenes, and needs wavs only for them; an inactive scene is still
#     checked and still rendered by the TTS run, so a new scene can be written
#     as active: false, rendered, and switched on once its wavs are in place.
#     An active scene's after: must name an active scene.
#
# IDs:
#     Every scene is keyed by its id, a short name chosen by hand.
#     A repeated key is not an error to a plain YAML loader: the last one silently
#     wins. The game's loader must reject duplicate keys.
#     Conversations stay lists, because their order is the order of play.
#     Every utterance in a scene has an id, a small integer. It is assigned once
#     and never renumbered or reused. The order of the lines comes from their
#     place in the list, not from the id. A line added later takes the next free number.
#     The request is an utterance and has an id.
#     An utterance plays from wav/<scene-id>.<utterance-id>.wav, e.g. nbn-valet.3
#     The whole name must be 31 characters or less (audio.md 7.1), so keep scene ids short.

setting:
    hotel: Hotel Ballard
    city: Seattle

# The cast of characters
#
cast:
    # The part the player plays. Her lines are under operator_lines: and in
    # the scenes' operator: keys, rendered only for recordings of whole scenes.
    hotel_operator:
        sex: female
        accent: generic American, warm and crisp
        description: the Hotel Ballard's switchboard operator, a young woman, courteous and efficient
    thornhill:
        sex: male
        accent: mid-Atlantic, suave
        description: Roger Thornhill, a 1950s New York advertising man; smooth and quick, a little impatient
    operator:
        sex: female
        accent: generic American
        description: public telephone operator (for long distance calls)
    local_operator:
        sex: female
        accent: generic American, flat and quick
        description: the local telephone company operator who answers when the hotel operator dials 0
        sample: Operator. What number are you calling? One moment, please, I'll give you long distance. Your party is on the line.
    rate_operator:
        sex: female
        accent: generic American, fast, flat, reading from a card
        description: the long distance rate and route operator, who gives the route and the charge
        sample: Rate and route. Chicago, New York, night person, two twenty-five. Portland direct, day station, eighty-five cents. Go ahead, Seattle.
    toll_a:
        sex: female
        accent: Pacific Northwest, pleasant
        description: a long distance toll operator on the route, answering with her town's name (Portland, Walla Walla)
        sample: Portland. Thank you, I'm ringing them now. They don't answer, Seattle. Shall I try them again in an hour?
    toll_b:
        sex: female
        accent: Chicago, brisk
        description: a long distance toll operator on the route, answering with her town's name (Chicago)
        sample: Chicago. Go ahead, I have you. Ringing your party now. The circuits to the east are busy, please hold the line.
    toll_c:
        sex: female
        accent: East Coast, crisp and nasal
        description: a long distance toll operator on the route, answering with her town's name (New York, Savannah)
        sample: New York. Just a moment, Seattle, I'm ringing. The line is busy, will you wait? Your party is answering now.
    toll_d:
        sex: female
        accent: Western, slow and friendly
        description: a long distance toll operator on the route, answering with her town's name (Boise, Yakima, Atlanta)
        sample: Boise. Well, hello there, Seattle. I'm ringing that number for you now. Nobody's picked up yet, give it a minute.
    valerian:
        sex: male
        accent: sinister foreign
        description: one of the assassins in North by Northwest
    valet:
        sex: male
        accent: midwest
        description: hotel valet
    pike:
        sex: male
        accent: Chicago, fast talking
        description: Harold Pike, traveling vacuum cleaner salesman, room 204
    albright:
        sex: female
        accent: refined American, older woman
        description: Mrs. Edith Albright, well-to-do widow from Spokane, room 302
    hale:
        sex: female
        accent: generic American, young and cheerful
        description: Betty Hale, on her honeymoon, room 305
    lindqvist:
        sex: male
        accent: Pacific Northwest, slow and plain
        description: Nils Lindqvist, owns fishing boats in Ballard, room 401
    crane:
        sex: female
        accent: generic American, precise
        description: Miss Dorothy Crane, schoolteacher from Yakima, room 404
    hollis:
        sex: male
        accent: generic American, older, dry
        description: Dr. Walter Hollis, visiting surgeon, room 101
    desk_clerk:
        sex: male
        accent: generic American, young and polite
        description: hotel front desk clerk
    waiter:
        sex: male
        accent: generic American, older and patient
        description: hotel room service order taker
    florist:
        sex: female
        accent: generic American, friendly
        description: clerk at the Harbor Florist
    pizza_man:
        sex: male
        accent: Italian American
        description: counterman at Sunny Hill Pizza
    dispatcher:
        sex: female
        accent: generic American, brisk
        description: dispatcher at Shilshole Cab
    maitre_d:
        sex: male
        accent: smooth, formal American
        description: maitre d' at Canlis
    reporter:
        sex: male
        accent: generic American, fast and nosy
        description: Joe Barrett, reporter for the Seattle Times
    martha:
        sex: female
        accent: A dog who can speak, with a deep dog-like voice
        description: Martha the dog
    marysmith:
        sex: female
        accent: >
            A 1930s American woman in her early thirties. Husky, slightly
            raspy alto with a hint of nasal brightness. Speaks quickly and
            crisply, with a dry, wisecracking, working-girl edge. Her voice
            is a little unstable: on emotional or surprised words it cracks
            upward into a brief, high squeak, then drops back to the husky
            register. Tough on the surface, vulnerable underneath. Clear
            mid-Atlantic-leaning diction, not breathy or sultry.
        description: Mary Smith in the film Easy Living
        sample: Look, mister, I work for a living. I ride the bus and I eat at the automat, and nobody ever gave me anything before.
    carsalesman:
        sex: male
        accent: American, but attempts to sound sophisticated with a pseudo British accent
        description: Salesman for the V16 Company of America

    # Guests added 2026-09-28.
    pemberton:
        sex: female
        accent: affected upper-class American, drawling and imperious
        description: Mrs. Vivian Pemberton, wealthy widow from Pasadena, room 102; nothing is ever quite right
    dobbs:
        sex: male
        accent: Nebraska, loud and cheerful
        description: Earl Dobbs, feed-store owner from Omaha on his first vacation, room 105
    vance:
        sex: female
        accent: sultry, low, a little sleepy
        description: Miss Lorraine Vance, nightclub singer appearing downtown, room 201; sleeps till noon
    beaumont:
        sex: male
        accent: Southern, booming, old-fashioned
        description: Colonel Augustus Beaumont, retired, of Savannah, Georgia, room 205
    finch:
        sex: male
        accent: generic American, nervous and fussy
        description: Howard Finch, accountant at a Rotary convention, room 303; a hypochondriac
        sample: Hello? This is Howard Finch, room three oh three. I'm terribly sorry to bother you, but I think I may be coming down with something.
    jim_hale:
        sex: male
        accent: generic American, young and eager
        description: Jim Hale, Betty Hale's new husband, room 305
        sample: Hello? This is Jim Hale, room three oh five. We just got married on Saturday, and my wife would like some champagne.

    # Hotel staff added 2026-09-28.
    housekeeper:
        sex: female
        accent: Scandinavian Ballard, patient but tried
        description: Mrs. Olsen, the head housekeeper
    bellcaptain:
        sex: male
        accent: generic American, gravelly, seen it all
        description: Gus, the bell captain
        sample: Bell captain. I'll send a boy right up for your bags, sir. Anything else, you just call down and ask for Gus.
    concierge:
        sex: male
        accent: polished, a touch continental
        description: Mr. Fairweather, the hotel concierge; knows everybody
    hostess:
        sex: female
        accent: generic American, bright and professional
        description: hostess at the Stoneburner, the hotel restaurant

    # Outside, added 2026-09-28.
    pigalle:
        sex: female
        accent: French, charming but firm
        description: reservationist at Place Pigalle
    rays_host:
        sex: male
        accent: Pacific Northwest, easygoing and casual
        description: the fellow who answers the phone at Ray's Boathouse
    telegraph_clerk:
        sex: male
        accent: generic American, clipped
        description: counter clerk at Western Union
        sample: Western Union. Go ahead with your message, sir. That's eighteen words, ninety cents, charged to your room.
    pharmacist:
        sex: male
        accent: generic American, kindly, older
        description: pharmacist at Ballard Pharmacy
    box_office:
        sex: female
        accent: generic American, gum-chewing, bored
        description: box office clerk at the Paramount Theatre
        sample: Paramount box office. Two shows tonight, seven and nine-fifteen. Balcony's seventy-five cents, the main floor is a dollar.
    ferry_clerk:
        sex: male
        accent: Pacific Northwest, salty
        description: information clerk at the Washington State Ferries dock
    nurse:
        sex: female
        accent: generic American, crisp
        description: nurse at the switchboard of Swedish Hospital

    # Far away, reached by long distance, added 2026-09-28.
    gruber:
        sex: male
        accent: Chicago, gruff
        description: Mr. Gruber, Pike's sales manager at the Whirlwind Vacuum Company in Chicago
        sample: Gruber here. Whirlwind Vacuum Company. I've got forty salesmen on the road and every one of them tells me it's raining.
    mrs_dunn:
        sex: female
        accent: Idaho, warm and worried
        description: Mrs. Dunn, Betty Hale's mother, in Boise
        sample: Hello? Betty, is that you, sweetheart? Oh, it's so good to hear your voice. Your father sends his love.
    lucinda:
        sex: female
        accent: Southern, genteel, sharp
        description: Miss Lucinda Beaumont, the Colonel's sister, in Savannah
    edna_finch:
        sex: female
        accent: generic American, practical
        description: Edna Finch, Howard's wife, in Walla Walla
    ruth_seaver:
        sex: female
        accent: Pacific Northwest, older, warm and chatty
        description: Mrs. Ruth Seaver, Mrs. Albright's sister, in Portland
        sample: Edith? Oh, I'm so glad you called back. I was down at the market, and then Mrs. Hanley stopped me on the stairs, and you know how she talks.
    mabel_dobbs:
        sex: female
        accent: Nebraska, plain-spoken and brisk
        description: Mabel Dobbs, Earl's wife, who minds the feed store in Wahoo, Nebraska
        sample: Earl? Is that you? Well, for heaven's sake. The hens are laying fine, the Hendersons paid their bill, and your mother called twice.
    wilbur:
        sex: male
        accent: Nebraska farm boy, slow and friendly
        description: Wilbur, the boy who works the counter at Dobbs Feed and Seed in Wahoo
        sample: Dobbs Feed and Seed, this is Wilbur. We got the laying mash in, and the chicken wire, and I think that's about all we got.
    dr_keller:
        sex: male
        accent: Minnesota, measured
        description: Dr. Keller of the Mayo Clinic in Rochester, Minnesota

    # Visitors on the lobby house phone, added 2026-09-28.
    gunderson:
        sex: female
        accent: Scandinavian Ballard, indignant
        description: Mrs. Gunderson, who bought a vacuum cleaner from Pike
    chester:
        sex: male
        accent: generic American, young, wheedling
        description: Chester, Mrs. Albright's nephew, always short of money
    admirer:
        sex: male
        accent: generic American, young and smitten
        description: a young sailor who heard Lorraine Vance sing last night
    eddie:
        sex: male
        accent: generic American, young man, sheepish
        description: Eddie Moran, a former pupil of Miss Crane, now in the Navy

# What the player says (game_control.md 4.7).
#     The game never plays these: the person at the board speaks them. They
#     are rendered in hotel_operator's voice, as operator.<id>, so that a
#     whole scene can be recorded with both halves of it (tts/scenes --batch).
#     A scene names one of these, or gives its own, with operator: on a line.
#
operator_lines:
    internal-greeting:
        id: 1
        text: How may I connect your call?
    outside-greeting:
        id: 2
        text: Hotel Ballard. How may I help you?
    long-distance-please:
        id: 3
        text: Long distance, please.
    busy:
        id: 4
        text: I'm sorry, that line is busy.

# Locations reached via public trunks, like local businesses.
# The number is what the operator must dial. Quoted so it stays a string.
# Its first three digits are a 1958 Seattle exchange (hardcopy/seattle-exchanges.csv):
# 783 is SUnset 3, and the operator's card prints it SU3-2250.
#
outside:
