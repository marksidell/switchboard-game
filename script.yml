---
# Switchboard game script.
#
# The general flow is this:
#     - A party signals the switchboard.
#         For a station, the line is seized.
#         For a trunk, a ring signal is generated.
#     - The operator connects to the line, which the game can detect, and speaks.
#     - The caller speaks the "request" to the operator
#     - The operator connects to the desired called party.
#         For a station, the operator connects and rings the station. The called party answers.
#         For a trunk, the operator hears dial tone, dials the number, hears ring, and the called party answers.
#
#  If no called party is specified, the call is to the operator and the callers asks a question.
#  After hearing a response, the caller hangs up.
#
# Lines:
#     A line is either a station name or an outside name.
#     A calling line that is an outside name is a call coming in on a trunk:
#     the game picks a free trunk and rings it.
#     A called line that is an outside name is a call going out: the operator
#     takes a trunk and dials the number.
#
# Calls to the operator (no called party):
#     The conversation holds only caller lines. Each one plays after the
#     operator has spoken and stopped (listen: speech, then silence).
#
# Waiting for the operator mid-conversation (game_control.md 4.6):
#     wait: true on a conversation line means it plays only after the
#     operator has spoken on that side of the call and stopped. Not allowed
#     in a call to the operator or a busy scene, where every line waits.
#
# Someone else on the line (game_control.md 4.6):
#     person: <cast member> on a conversation line means that person says it,
#     on the same side of the call, in place of the scene's party there.
#
# Long distance:
#     The hotel operator dials 0 and gets the local operator, who is
#     called: person: local_operator. The hotel operator asks for long
#     distance; the long-distance operator's first line is marked wait: true
#     and person: operator. She then builds the route as the 1950s operators
#     did, every step on the trunk with a person: of its own: she asks the
#     rate operator (rate_operator) for the route and rate, and rings through
#     each toll center on it (toll_a to toll_d), each answering with its
#     town's name, the last one ringing the number. The party she rings
#     speaks with a person: too. pause: gives each operator on the route a
#     moment to come on the line, and ringback: lets the audience hear the far
#     end ring before the party answers. The long-distance operator may ask
#     the hotel operator whether to charge the room, and her next line is
#     marked wait:. A guest who asked for the time and charges hears them
#     from her when the call ends, unasked.
#     After a call a guest placed has ended, she rings the hotel back with
#     the time and charges so the room can be billed: a following scene, a
#     call to the operator from outside line operator whose request is the
#     room, the time and the charge, said once, with no conversation, so she
#     hangs up without waiting (game_control.md 4.6, Rev 24). Not for collect
#     calls, or calls placed to a guest from outside.
#     When the circuits are busy she calls back: a following scene rings the
#     hotel on a trunk from outside line operator, and the hotel operator puts
#     the call through to the room. A call coming in from long distance is heard
#     from the last operator on its route only.
#
# A beat before a line (game_control.md 4.6):
#     pause: <seconds> is silence before the line plays; ringback: <seconds>
#     is ringback tone on the trunk before it, only on a called: line of a
#     call to an outside line. Both come after any wait:, pause first.
#
# What the operator says (game_control.md 4.7):
#     operator: on a line is what the player says before it, wherever the
#     game waits for her: the request, a wait: line, and every line of a call
#     to the operator or a busy call. It is the name of a line under
#     operator_lines:, or an id and text of the scene's own:
#         operator: internal-greeting
#         operator:
#             id: 9
#             text: Three cents, sir.
#     closing: on a scene, in either form, is what she says after the last
#     line, in a call to the operator or a busy call, where she is still on
#     the line with the caller when it ends.
#     The game ignores it; it is for recordings of whole scenes. An id given
#     here is one of the scene's, as unique and as permanent as any other.
#
# Busy:
#     busy: true under called means the operator hears busy tone when dialing.
#     The conversation then holds only caller lines, played after the operator
#     goes back to the caller and tells them.
#     if_busy: on a call from a room to a room is a list of caller lines for
#     when the called station is already on another call: each plays after
#     the operator has spoken, and the caller hangs up (game_control.md 4.11).
#     Otherwise the call goes through and they are not heard.
#
# Order:
#     Scenes are drawn at random. A scene with after: is never drawn. It starts
#     delay seconds after the named scene ends, as a new call: the calling line
#     goes off-hook (station) or rings (trunk) again, as for any other scene.
#     Every line in the named scene has hung up by then, so for a caller who
#     calls straight back, delay is also how long they stay on-hook.
#     A scene with after: can itself be followed, so a story can run to any
#     number of calls. Each scene has at most one follower.
#     mode: concurrent on an after: scene starts it delay seconds after the
#     named scene *starts*, connected or not, so calls arrive almost together
#     (game_control.md 4.4, Rev 39). delay may be a range, [2, 5], drawn at
#     random. A concurrent scene waits for a free call slot rather than
#     being dropped.
#
# A scenario (game_control.md 4.10):
#     after_handled: <n> on a scene with no after: keeps it out of the deck.
#     It is dealt once a game, as the next call once n calls have been
#     handled, never in tutor or listen pacing; its concurrent followers are
#     the rest of the scenario.
#
# Active:
#     Every scene says active: true or active: false. The game plays only
#     active scenes, and needs wavs only for them; an inactive scene is still
#     checked and still rendered by the TTS run, so a new scene can be written
#     as active: false, rendered, and switched on once its wavs are in place.
#     An active scene's after: must name an active scene.
#
# IDs:
#     Every scene is keyed by its id, a short name chosen by hand.
#     A repeated key is not an error to a plain YAML loader: the last one silently
#     wins. The game's loader must reject duplicate keys.
#     Conversations stay lists, because their order is the order of play.
#     Every utterance in a scene has an id, a small integer. It is assigned once
#     and never renumbered or reused. The order of the lines comes from their
#     place in the list, not from the id. A line added later takes the next free number.
#     The request is an utterance and has an id.
#     An utterance plays from wav/<scene-id>.<utterance-id>.wav, e.g. nbn-valet.3
#     The whole name must be 31 characters or less (audio.md 7.1), so keep scene ids short.

setting:
    hotel: Hotel Ballard
    city: Seattle

# The cast of characters
#
# recorded: <performer> on an entry means a person performs the part: its
# lines are recorded with tts/record, never rendered (tts_task.md 6.4).
#
cast:
    # The part the player plays. Her lines are under operator_lines: and in
    # the scenes' operator: keys, rendered only for recordings of whole scenes.
    hotel_operator:
        sex: female
        accent: generic American, warm and crisp
        description: the Hotel Ballard's switchboard operator, a young woman, courteous and efficient
    # The voice of tutor mode (game_control.md 4.9): a senior operator who
    # talks the player through each call over the loudspeaker. Her lines
    # are under tutor: below, not in any scene.
    # Her voice is cloned from a public-domain Bell System training film
    # (tts/voices/tutor.wav and .json, tts_task.md 5.1), not designed; sample:
    # and voice: are kept for a designed voice, should one be wanted.
    tutor:
        sex: female
        accent: mid-Atlantic
        description: a senior telephone operator who trains new operators at the board
        sample: >
            You are sitting at the switchboard of the Hotel Ballard. Take the
            rear cord of any free pair, and plug it into the jack with the
            lighted lamp.
        voice: >
            A woman in her sixties, a senior telephone operator who has trained
            new operators at the board for years. A calm, warm, authoritative
            voice with a mid-Atlantic accent: crisp consonants, soft r's,
            measured and unhurried, like the narrator of a 1950s documentary
            film. Clear, deliberate speech to someone sitting beside her.
    thornhill:
        sex: male
        accent: mid-Atlantic, suave
        description: Roger Thornhill, a 1950s New York advertising man; smooth and quick, a little impatient
        # voice: replaces the description built from sex, accent and
        # description, word for word (tts/prompt.py). Qualities only: it never
        # names a real person (tts_task.md 5.1).
        voice: >
            A man in his early fifties with a light, warm baritone and a
            transatlantic accent: clipped consonants, soft r's, a lilting,
            sing-song rise and fall. Quick, witty and charming, with a touch
            of amused exasperation; the polish of a 1950s film leading man.
            Natural, conversational telephone speech, 1950s.
    operator:
        sex: female
        accent: generic American
        description: public telephone operator (for long distance calls)
    local_operator:
        sex: female
        accent: generic American, flat and quick
        description: the local telephone company operator who answers when the hotel operator dials 0
        sample: Operator. What number are you calling? One moment, please, I'll give you long distance. Your party is on the line.
        voice: >
            A young woman of about twenty with a high, bright voice, quick
            and a little bored, clipping her words short. Natural,
            conversational telephone speech, 1950s.
    rate_operator:
        sex: female
        accent: generic American, fast, flat, reading from a card
        description: the long distance rate and route operator, who gives the route and the charge
        sample: Rate and route. Chicago, New York, night person, two twenty-five. Portland direct, day station, eighty-five cents. Go ahead, Seattle.
        voice: >
            A woman in her fifties with a low, husky contralto, dry and
            flat, reading figures off a card in an even monotone. Natural,
            conversational telephone speech, 1950s.
    toll_a:
        sex: female
        accent: Pacific Northwest, pleasant
        description: a long distance toll operator on the route, answering with her town's name (Portland, Walla Walla)
        sample: Portland. Thank you, I'm ringing them now. They don't answer, Seattle. Shall I try them again in an hour?
        voice: >
            A woman in her forties with a soft, warm, unhurried voice and a
            gentle Pacific Northwest manner. Natural, conversational
            telephone speech, 1950s.
    toll_b:
        sex: female
        accent: Chicago, brisk
        description: a long distance toll operator on the route, answering with her town's name (Chicago)
        sample: Chicago. Go ahead, I have you. Ringing your party now. The circuits to the east are busy, please hold the line.
        voice: >
            A woman in her thirties, brisk, businesslike and loud, with a
            hard Chicago edge. Natural, conversational telephone speech,
            1950s.
    toll_c:
        sex: female
        accent: East Coast, crisp and nasal
        description: a long distance toll operator on the route, answering with her town's name (New York, Savannah)
        sample: New York. Just a moment, Seattle, I'm ringing. The line is busy, will you wait? Your party is answering now.
        voice: >
            A woman in her late twenties with a sharp, nasal, very fast New
            York snap. Natural, conversational telephone speech, 1950s.
    toll_d:
        sex: female
        accent: Western, slow and friendly
        description: a long distance toll operator on the route, answering with her town's name (Boise, Yakima, Atlanta)
        sample: Boise. Well, hello there, Seattle. I'm ringing that number for you now. Nobody's picked up yet, give it a minute.
        voice: >
            A woman in her sixties with a slow, gravelly voice and a
            friendly Western drawl. Natural, conversational telephone
            speech, 1950s.
    valerian:
        sex: male
        accent: sinister foreign
        description: one of the assassins in North by Northwest
    valet:
        sex: male
        accent: midwest
        description: hotel valet
    pike:
        sex: male
