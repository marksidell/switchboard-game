# The switchboard's 30 station jacks, as the page draws them (game_control.md 6.3).
#     jack:    the jack number on the board, 1..30
#     label:   the text on the board's designation strip at that jack
#     station: the station above whose circuit is cabled to this jack.
#              Leave it out for a jack with nothing cabled: the page still
#              draws it, labelled, as if it were working.
#     guest:   who is staying in the room at this jack, as typed on the
#              operator's guest list card (hardcopy/cards.py). Leave it out
#              for an unoccupied room or a jack that is not a room. The game
#              does not read it.
# Every station must be on exactly one jack. A jack not listed here is drawn
# as an empty outline.
#
jacks:
    -   jack: 1
        label: "Front Desk"
        station: frontdesk
    -   jack: 2
        label: "Lobby"
        station: lobby
