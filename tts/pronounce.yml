# Whole-word substitutions applied only to the text sent to the model
# (tts_task.md 6.2). The script's own text is never changed by this — what is
# written in script.yml is what the scene says; this is only how it is spoken.
#
# Expected to grow once Mark has listened. A model that reads "463" as "four
# hundred sixty-three" is not wrong, it is just not how an operator or a guest
# says a room number.
#
# Keys are matched as whole words, longest first, so "284-1187" is taken before
# "284" would be.

# Room numbers, as a 1950s speaker says them. The rooms were renumbered to
# the board's jacks on 2026-09-28; the old ones are gone from the script.
"101": one oh one
"102": one oh two
"103": one oh three
"105": one oh five
"201": two oh one
"204": two oh four
"205": two oh five
"302": three oh two
"303": three oh three
"305": three oh five
"401": four oh one
"403": four oh three
"404": four oh four
"412": four twelve

# Telephone numbers, digit by digit with the exchange split off; round
# hundreds and thousands as an operator says them.
"4-1187": four, one one eight seven
"3-4400": three, forty-four hundred
"4-2000": four, two thousand
"3-7719": three, seven seven one nine
"2-3100": two, thirty-one hundred
"6-2214": six, two two one four
"23-J": twenty-three J

# The rate operator's charges, read as digits.
"8-5": eight five
"9-5": nine five
"1-1-5": one one five
"2-1-0": two one oh
"2-2-5": two two five
"2-4-0": two four oh
"2-3-0": two three oh

# Names the model is likely to mangle. Only the ones that are genuinely
# ambiguous — Ballard, Seattle, Portland and Oregon it will already know.
"Canlis": CAN-liss
"Lindqvist": LIND-kwist
"Shilshole": SHIL-shole
"Seaver": SEE-ver
"Nils": Nils
"Pigalle": pee-GAHL
"Beaumont": BO-mont
"Gruber": GROO-ber
# Lowercase: "WAH-hoo" was spelt out, W-A-H, as capitals often are
# (Mark, 2026-09-29).
"Wahoo": wah-hoo
# As Idaho says it, with an s; the model sometimes made it "boy-zee" or
# worse (Mark, 2026-09-29).
"Boise": boy-see

# One person's way of saying things, applied to that person's lines only
# and matched whatever the case. Checked before the entries above.
speakers:
    # The reservationist at Place Pigalle, in her French (Mark, 2026-09-29).
    # The guests say "Place Pigalle" their own way, by the general entry.
    pigalle:
        "Place Pigalle": plahss pee-GAHL
        "bonsoir": bohn-SWAHR
        # Whole, so its "a" is spoken "ah", not as a letter.
        "a bientot": ah byahn-TOH
        "bientot": byahn-TOH
        "mais oui": may WEE
        "madame": mah-DAHM
        "mademoiselle": mahd-mwah-ZELL
        "monsieur": muh-SYUR
        "non": nohn
        "desolee": day-zoh-LAY
    # Lindqvist's Swedish "ja", long and open. Miss Vance's "will ya?" is
    # hers and stays American.
    lindqvist:
        "ya": yah
    # Martha's barks, rougher than the dictionary word: a rolled r and a
    # growl on the end.
    martha:
        "woof": rrrowf
