# sbgame — the 551 switchboard game engine.
#
# Converted from setup.py, which this replaces. Same information, stated rather
# than executed.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sbgame"
version = "0.1.0"
description = "551 switchboard simulator game engine"
requires-python = ">=3.10"
# sbgame also imports `tts`, the script.yml loader, which is this repository's
# tts/ package (sbgame-tts) rather than anything on PyPI, so it is not listed
# here: install the two together, `pip install engine tts` (engine/README.md).
dependencies = [
    "aiomqtt",       # the MQTT client; brings paho-mqtt with it
    "ruamel.yaml",  # script.yml, through the loader shared with tts/
    "streamdeck",   # the Stream Deck+, over hidapi (apt: libhidapi-libusb0)
    "pillow",       # its key and strip images
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
sbgame = "sbgame.main:main"
# The stand-in for the controller, the audio program and the operator,
# for use until the boards arrive.
sbgame-sim = "sbgame.simulate:main"
# The Stream Deck+ that carries the game's controls (game_control.md 10).
sbgame-streamdeck = "sbgame.streamdeck:main"
# Trunk and station boards wired straight together, tested pair by pair.
sbgame-boardtest = "sbgame.boardtest:main"
# The host's public address for the page (mqtt.md 6.3).
sbgame-netcheck = "sbgame.netcheck:main"

[tool.setuptools]
packages = ["sbgame"]

[tool.pytest.ini_options]
# The checkout's own sbgame and tts come first, ahead of any installed copy,
# and the tests' shared harness beside them.
pythonpath = [".", "..", "tests"]
testpaths = ["tests"]
# No .pytest_cache in the tree; nothing here uses --lf.
addopts = "-p no:cacheprovider"
