# 551 Switchboard Simulator broker. mqtt.md 9.
#
# Two listeners:
#   1883  plain MQTT, for the controller, sbaudio and the game program.
#   9001  WebSockets, plain, bound to loopback. nginx terminates TLS on 443 and
#         reverse-proxies the page's socket to it, so nothing reaches this port
#         from off the host and Mosquitto holds no certificate.
#
# Mosquitto served the page itself through Rev 16. On this host that could not
# work: libwebsockets creates the WebSockets socket after Mosquitto drops to the
# mosquitto user, so a privileged port fails, and the listener advertises h2 in
# ALPN while being unable to serve HTTP/2, so a browser gets nothing.

per_listener_settings false
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

listener 1883
protocol mqtt

listener 9001 127.0.0.1
protocol websockets
